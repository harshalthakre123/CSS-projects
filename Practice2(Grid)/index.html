<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">

    <link  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <main>
        <header>
            <div class="logo-div">
                <i class="fa-solid fa-bars-staggered fa-xl" style="color: rgb(0, 0, 0);"></i>
                <h1>Bright.</h1>
            </div>
            <div class="search-box">
                <input type="text" placeholder="Search product, items">
                <i class="fa-solid fa-magnifying-glass fa-lg" style="color: rgb(0, 0, 0);"></i>
            </div>
            <div class="user-div">
                <i class="fa-solid fa-bell fa-xl" style="color: rgb(255, 199, 0);"></i>
                <i id="profile" class="fa-regular fa-user fa-lg" style="color: rgb(0, 0, 0);"></i>
            </div>
        </header>
        <div class="upper">
            <i class="fa-solid fa-less-than" style="color: rgb(0, 0, 0);"></i>
            <div class="u-content">
                <p>August 01-26</p>
                <h1>Enjoy free home </br>dilevery in this summer</h1>
                <p>Designer Dresses. Pick from Trendy Designer Dress</p>
                <button class="btn">Get Started</button>
            </div>
            <i class="fa-solid fa-greater-than" style="color: rgb(0, 0, 0);"></i>
        </div>
        <div class="bottom-left">
            <div class="price">
                <p>Start From $45.30</p>
                <i class="fa-regular fa-heart" style="color: rgb(0, 0, 0);"></i>
            </div>
            <div class="bl-heading">
                <h1>Women's Shoe</h1>
            </div>
        </div>
        <div class="bottom-center">
            <div class="price">
                <p>Start From $105.00</p>
                <i class="fa-regular fa-heart" style="color: rgb(0, 0, 0);"></i>
            </div>
            <div class="bl-heading">
                <h1>Cycle Accessories</h1>
            </div>
        </div>
        <div class="bottom-right">
            <div class="price">
                <p>Start From $34.00</p>
                <i class="fa-regular fa-heart" style="color: rgb(0, 0, 0);"></i>
            </div>
            <div class="bl-heading">
                <h1>Home Accessories</h1>
            </div>
            
        </div>

    </main>
